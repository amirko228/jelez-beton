# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    ports: []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
