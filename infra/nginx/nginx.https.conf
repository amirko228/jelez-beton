events {}

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  upstream client_upstream {
    server client:3000;
  }

  upstream admin_upstream {
    server admin:3001;
  }

  upstream server_upstream {
    server server:4000;
  }

  server {
    listen 80;
    server_name jbi.com.kg www.jbi.com.kg;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name jbi.com.kg www.jbi.com.kg;

    ssl_certificate /etc/letsencrypt/live/jbi.com.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jbi.com.kg/privkey.pem;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location /api/ {
      proxy_pass http://server_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      proxy_pass http://admin_upstream/admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://client_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
